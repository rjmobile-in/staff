<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance | Professional Terminal</title>
  <link rel="icon" type="image/png" href="logo.png" />
  
  <script>
    if (localStorage.getItem('rj_theme') === 'light') { 
      document.documentElement.classList.add('light-theme'); 
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    /* =========================================================
       1. ROOT VARIABLES & THEME (Matched to Admin/POS)
       ========================================================= */
    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    :root {
      --bg-base: #0f172a; 
      --bg-surface: #1e293b;
      --card-bg: #1e293b; 
      --card-bg-alpha: rgba(30, 41, 59, 0.85);
      --card-border: #334155;
      
      --primary: #3b82f6; 
      --primary-hover: #2563eb; 
      --primary-alpha: rgba(59, 130, 246, 0.15);
      
      --text-main: #f8fafc; 
      --text-soft: #94a3b8;
      
      --success: #10b981; 
      --success-alpha: rgba(16, 185, 129, 0.15);
      --danger: #ef4444; 
      --danger-alpha: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b; 
      --warning-alpha: rgba(245, 158, 11, 0.15);
      
      --input-bg: #0f172a; 
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
    }

    html.light-theme {
      --bg-base: #f1f5f9; 
      --bg-surface: #ffffff;
      --card-bg: #ffffff; 
      --card-bg-alpha: rgba(255, 255, 255, 0.9);
      --card-border: #e2e8f0;
      
      --primary: #4f46e5; 
      --primary-hover: #4338ca; 
      --primary-alpha: rgba(79, 70, 229, 0.1);
      
      --text-main: #0f172a; 
      --text-soft: #64748b; 
      
      --input-bg: #f8fafc; 
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-base); 
      color: var(--text-main); 
      font-size: 14px; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 24px 16px; 
      transition: background-color 0.4s ease; 
      overflow-x: hidden; 
      -webkit-font-smoothing: antialiased;
    }
    
    .brand-title, .btn-action, h2, h3 { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-effect { background: var(--card-bg-alpha); backdrop-filter: blur(16px); border: 1px solid var(--card-border); }

    /* =========================================================
       2. TYPOGRAPHY & BUTTONS
       ========================================================= */
    .btn-secondary { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 10px 16px; border-radius: var(--radius-md); font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
    .btn-secondary:hover { background: var(--input-bg); border-color: var(--primary); color: var(--primary); }

    .btn-action { width: 100%; padding: 16px; border-radius: var(--radius-md); border: none; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: var(--shadow-sm); }
    .btn-in { background: var(--success); }
    .btn-out { background: var(--danger); }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; filter: grayscale(50%); }
    .btn-action:not(:disabled):hover { filter: brightness(1.1); transform: translateY(-2px); box-shadow: var(--shadow-md); }

    /* =========================================================
       3. FORM INPUTS & UTILITIES
       ========================================================= */
    .input-field { width: 100%; padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-main); margin-bottom: 16px; outline: none; font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif; transition: all 0.2s; box-shadow: inset 0 1px 2px rgba(0,0,0,0.02); }
    .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-alpha); background: var(--card-bg); }
    
    #global-loader { position: fixed; inset: 0; background: var(--bg-base); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; color: var(--text-soft); font-weight: 600; font-size: 15px; }
    .spinner { width: 44px; height: 44px; border: 4px solid var(--card-border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast { 
      visibility: hidden; 
      min-width: 300px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      padding: 16px 24px; 
      position: fixed; 
      z-index: 10000; 
      bottom: 40px; 
      left: 50%; 
      transform: translate(-50%, 20px); 
      font-size: 14px; 
      font-weight: 600; 
      color: var(--text-main); 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: var(--radius-lg); 
      box-shadow: var(--shadow-md); 
      opacity: 0; 
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); 
      pointer-events: none; 
    }
    #toast.show { visibility: visible; opacity: 1; transform: translate(-50%, 0); }

    /* =========================================================
       4. LOGIN SCREEN
       ========================================================= */
    #login-screen { display: none; background: var(--card-bg); padding: 48px 40px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); text-align: center; width: 100%; max-width: 420px; margin-top: 10vh; border: 1px solid var(--card-border); }
    #login-screen h2 { font-weight: 800; font-size: 26px; margin-bottom: 12px; color: var(--text-main); }
    #login-screen p { color: var(--text-soft); margin-bottom: 32px; font-size: 14px; }
    
    #login-btn { width: 100%; padding: 14px; border-radius: var(--radius-md); border: none; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; box-shadow: var(--shadow-sm); }
    #login-btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    
    #error-msg { color: var(--danger); font-size: 13px; font-weight: 600; margin-top: 16px; display: none; background: var(--danger-alpha); padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--danger-alpha); }
    
    .password-wrapper { position: relative; width: 100%; margin-bottom: 16px; }
    .password-wrapper .input-field { margin-bottom: 0; padding-right: 48px; }
    .toggle-password { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-soft); cursor: pointer; display: flex; transition: color 0.2s; }
    .toggle-password:hover { color: var(--text-main); }

    /* =========================================================
       5. DASHBOARD LAYOUT & COMPONENTS
       ========================================================= */
    #dashboard { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 540px; }
    
    .header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 24px; padding: 16px 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
    .brand-area { display: flex; align-items: center; gap: 14px; }
    .brand-title { font-size: 18px; font-weight: 800; }
    .brand-tag { font-size: 11px; color: var(--text-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px;}
    .header-controls { display: flex; gap: 12px; align-items: center; }
    #theme-toggle { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-soft); cursor: pointer; padding: 10px; border-radius: var(--radius-md); transition: 0.2s; }
    #theme-toggle:hover { background: var(--input-bg); color: var(--text-main); }

    .main-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 24px; width: 100%; position: relative; overflow: visible; margin-bottom: 24px; box-shadow: var(--shadow-sm); }
    .card-border-top::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), #3b82f6); border-top-left-radius: 20px; border-top-right-radius: 20px; }
    
    /* =========================================================
       6. CUSTOM SEARCHABLE DROPDOWN
       ========================================================= */
    .custom-dropdown { position: relative; width: 100%; margin-top: 8px; }
    .custom-dropdown-trigger { width: 100%; padding: 14px 16px; border-radius: var(--radius-md); border: 1px solid var(--card-border); background: var(--input-bg); color: var(--text-soft); font-size: 14px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; }
    .custom-dropdown-trigger:hover:not(.disabled) { border-color: var(--primary); }
    .custom-dropdown-trigger.selected { color: var(--text-main); font-weight: 600; }
    .custom-dropdown-trigger.disabled { opacity: 0.5; cursor: not-allowed; background: var(--bg-base); }
    
    .custom-dropdown-menu { position: absolute; top: calc(100% + 8px); left: 0; right: 0; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); z-index: 100; display: none; flex-direction: column; overflow: hidden; }
    .custom-dropdown-menu.show { display: flex; }
    
    .custom-dropdown-search-wrapper { padding: 12px; border-bottom: 1px solid var(--card-border); background: var(--card-bg); }
    .custom-dropdown-search { width: 100%; padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--card-border); background: var(--bg-base); color: var(--text-main); outline: none; font-size: 14px; font-weight: 500; }
    .custom-dropdown-search:focus { border-color: var(--primary); }
    
    .custom-dropdown-options { max-height: 220px; overflow-y: auto; padding: 8px 0; }
    .custom-option { padding: 10px 16px; cursor: pointer; color: var(--text-main); font-weight: 500; transition: background 0.2s; font-size: 13px; }
    .custom-option:hover { background: var(--input-bg); color: var(--primary); }
    .custom-option.disabled-option { color: var(--text-soft); cursor: default; text-align: center; }
    .custom-option.disabled-option:hover { background: transparent; color: var(--text-soft); }

    /* =========================================================
       7. AI Camera Container & Action Row
       ========================================================= */
    #video-wrapper { position: relative; background: #000; border-radius: var(--radius-md); overflow: hidden; width: 100%; height: 380px; margin-bottom: 24px; border: 1px solid var(--card-border); display: flex; align-items: center; justify-content: center; }
    
    #native-video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    .mirrored { transform: scaleX(-1); }
    #face-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
    
    #face-status { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--card-bg-alpha); backdrop-filter: blur(4px); padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--text-main); border: 1px solid var(--card-border); z-index: 15; text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s; white-space: nowrap;}
    #face-status.detected { color: var(--success); border-color: var(--success); }
    #face-status.warning { color: var(--warning); border-color: var(--warning); }

    #flash-overlay { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s; z-index: 20; }
    #flash-overlay.flash { opacity: 0.8; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>

  <div id="global-loader" class="glass-effect"><div class="spinner"></div><p>Connecting Secure Session...</p></div>
  <div id="toast"><div id="toast-icon"></div><div id="toast-msg"></div></div>

  <!-- Login Screen -->
  <div id="login-screen">
    <h2>Attendance Terminal</h2>
    <p>Sign in to unlock your branch scanner.</p>
    <input type="email" id="email-input" class="input-field" placeholder="branch@rjmobile.com" />
    <div class="password-wrapper">
      <input type="password" id="password-input" class="input-field" placeholder="Enter terminal password" />
      <button id="toggle-password-btn" class="toggle-password" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <button id="login-btn">Secure Login</button>
    <div id="error-msg">Authentication failed.</div>
  </div>

  <!-- Main Terminal Application -->
  <div id="dashboard">
    <div class="header glass-effect">
      <div class="brand-area">
        <div>
          <div class="brand-title">Terminal POS</div>
          <div class="brand-tag" id="detected-branch-display">Identifying Location...</div>
        </div>
      </div>
      <div class="header-controls">
        <button id="theme-toggle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></button>
        <button id="logout-btn" class="btn-secondary">Log Out</button>
      </div>
    </div>

    <!-- Active Cashier Select -->
    <div class="main-card card-border-top" style="padding: 20px 24px; margin-bottom: 24px;">
      <label style="font-size: 11px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.5px;">Active Employee</label>
      
      <div class="custom-dropdown" id="staff-dropdown">
        <div class="custom-dropdown-trigger disabled" id="staff-dropdown-trigger">
          <span id="staff-trigger-text">Connecting...</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        
        <div class="custom-dropdown-menu" id="staff-dropdown-menu">
          <div class="custom-dropdown-search-wrapper">
            <input type="text" id="staff-search" class="custom-dropdown-search" placeholder="🔍 Search name (1st time only)..." autocomplete="off" />
          </div>
          <div class="custom-dropdown-options" id="staff-options">
            <div class="custom-option disabled-option">Loading...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scanner Feed Card -->
    <div class="main-card">
      
      <button id="switch-camera-btn" class="btn-secondary" style="width: 100%; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 9v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9"/><path d="M9 22V12h6v10M2 10.6L12 2l10 8.6"/></svg>
        Switch Camera (Front/Back)
      </button>

      <div id="video-wrapper">
        <video id="native-video" autoplay muted playsinline></video>
        <canvas id="face-canvas"></canvas>
        <div id="face-status">Waiting for AI...</div>
        <div id="flash-overlay"></div>
      </div>

      <div class="btn-row">
        <button id="btn-clock-in" class="btn-action btn-in" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> 
          In + Photo
        </button>
        <button id="btn-clock-out" class="btn-action btn-out" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> 
          Out + Photo
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://rezumapzlsjnkitxvsul.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlenVtYXB6bHNqbmtpdHh2c3VsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzNTY2NjUsImV4cCI6MjA5OTkzMjY2NX0.IVUZVjZUuiM9qTcKAIIxJth_zSIGJUWTaubUV4Fy0_Y';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { storageKey: 'rj_branch_terminal_auth' }
    });

    // --- Relational & State Variables ---
    let currentFacingMode = "user";
    let cameraActive = false;
    let isSwitchingCamera = false;
    let localStream = null;
    let detectionInterval = null;
    
    let isFaceDetected = false;
    let allowedAction = null; 
    let faceMatcher = null;   
    let currentLiveDescriptor = null; 
    let manualOverride = false; 
    let faceLostTimer = null; 

    // Relational Identity vars
    let currentBranchId = null;
    let currentBranchName = ""; 
    
    let staffMap = {}; // Maps id to { id, name }
    let unregisteredStaffList = []; // Array of objects { id, name }
    
    let currentStaffId = null; 
    let currentStaffName = "";
    
    let isProcessing = false;
    
    const flashOverlay = document.getElementById('flash-overlay');
    const btnIn = document.getElementById('btn-clock-in');
    const btnOut = document.getElementById('btn-clock-out');
    const videoEl = document.getElementById('native-video');
    const canvasEl = document.getElementById('face-canvas');
    const statusEl = document.getElementById('face-status');

    function displayToast(msg, statusType = "success") {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      document.getElementById('toast-msg').innerText = msg;
      
      if (statusType === "success") {
        icon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5"><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
      }
      else if (statusType === "error") {
        icon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
      }
      else {
        icon.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      }
      
      toast.className = "show";
      if (toast.timeout) clearTimeout(toast.timeout);
      toast.timeout = setTimeout(() => { toast.className = ""; }, 4000);
    }

    // --- 1. Load Recognition Models & Supabase Face Embeddings ---
    async function initScanner() {
        if(cameraActive) return;
        statusEl.innerText = "Loading AI Models...";
        try {
            const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
            
            // Load Detection, Landmark, and Recognition networks
            await Promise.all([
                faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68TinyNet.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]);

            await loadKnownFaces();
            startCamera(currentFacingMode);
        } catch(err) {
            console.error("AI Model Load Error:", err);
            displayToast("Failed to initialize Face Recognition AI.", "error");
        }
    }

    // Load registered face descriptors from Supabase
    async function loadKnownFaces() {
        statusEl.innerText = "Syncing Face Profiles...";
        const { data: staffData } = await supabase.from('staff_directory').select('id, name, face_descriptor');
        
        if (staffData && staffData.length > 0) {
            const labeledDescriptors = [];
            staffData.forEach(staff => {
                if (staff.face_descriptor && Array.isArray(staff.face_descriptor) && staff.face_descriptor.length > 0) {
                    const descriptorArray = new Float32Array(staff.face_descriptor);
                    // Use staff.id as the core identifying label in the AI
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(staff.id, [descriptorArray]));
                }
            });

            if (labeledDescriptors.length > 0) {
                // Distance threshold 0.5 (lower = stricter match)
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.50);
            }
        }
    }

    // --- 2. Camera Controls ---
    async function startCamera(facingMode) {
        try {
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            localStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } } 
            });
            
            videoEl.srcObject = localStream;
            
            if (facingMode === "user") {
                videoEl.classList.add("mirrored");
                canvasEl.classList.add("mirrored");
            } else {
                videoEl.classList.remove("mirrored");
                canvasEl.classList.remove("mirrored");
            }
            
            cameraActive = true;
            statusEl.innerText = "Scanning for Face...";
        } catch (err) {
            console.error(err);
            displayToast("Camera access denied.", "error");
        }
    }

    // --- 3. Live Detection & Recognition Loop ---
    videoEl.addEventListener('play', () => {
        const displaySize = { width: videoEl.clientWidth, height: videoEl.clientHeight };
        faceapi.matchDimensions(canvasEl, displaySize);
        
        if (detectionInterval) clearInterval(detectionInterval);
        
        detectionInterval = setInterval(async () => {
            if(!cameraActive || isSwitchingCamera || isProcessing) return;

            // Single face detection + landmark + descriptor extraction
            const detection = await faceapi.detectSingleFace(
                videoEl, 
                new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 })
            ).withFaceLandmarks(true).withFaceDescriptor();

            // Clear canvas every frame to ensure NO VISUAL BOUNDING BOXES are drawn
            const ctx = canvasEl.getContext('2d');
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);

            if (detection) {
                // Instantly clear the reset timer if face returns to frame
                if (faceLostTimer) {
                    clearTimeout(faceLostTimer);
                    faceLostTimer = null;
                }

                currentLiveDescriptor = detection.descriptor; // Save current vector
                isFaceDetected = true;

                // Match against known staff database
                if (faceMatcher) {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                    
                    if (bestMatch.label !== 'unknown') {
                        // ==== REGISTERED FACE DETECTED ====
                        // bestMatch.label is the UUID. Resolve name from map.
                        const matchedId = bestMatch.label;
                        const matchedName = staffMap[matchedId] ? staffMap[matchedId].name : "Unknown Staff";
                        const confidence = Math.round((1 - bestMatch.distance) * 100);
                        
                        statusEl.innerText = `Recognized: ${matchedName.split(' ')[0]} (${confidence}%)`;
                        statusEl.className = "detected";

                        // SPOOF PROTECTION: Force lock to recognized face and kill any manual override
                        if (currentStaffId !== matchedId) {
                            currentStaffId = matchedId;
                            currentStaffName = matchedName;
                            manualOverride = false;
                            
                            const trigger = document.getElementById('staff-dropdown-trigger');
                            document.getElementById('staff-trigger-text').innerText = `${currentStaffName} (Auto-Identified)`;
                            trigger.classList.add('selected');
                            trigger.classList.add('disabled'); // Lock the dropdown entirely
                            
                            checkStaffStatus(currentStaffId, currentStaffName);
                        }
                    } else {
                        // ==== UNREGISTERED FACE DETECTED ====
                        statusEl.className = "warning";
                        
                        const trigger = document.getElementById('staff-dropdown-trigger');
                        // Unlock dropdown ONLY for unknown faces so they can register
                        if(!manualOverride) {
                            trigger.classList.remove('disabled'); 
                            statusEl.innerText = "New Face: Select Name Below";
                        } else if (manualOverride && currentStaffId) {
                            statusEl.innerText = `Ready to Register: ${currentStaffName.split(' ')[0]}`;
                            statusEl.className = "detected";
                        }
                    }
                } else {
                    // No database exists yet at all
                    statusEl.innerText = "Face Detected (Select Name Below)";
                    statusEl.className = "warning";
                    document.getElementById('staff-dropdown-trigger').classList.remove('disabled');
                }

                updateButtonStates();
            } else {
                // ==== NO FACE DETECTED ====
                if (isFaceDetected) {
                    isFaceDetected = false;
                    currentLiveDescriptor = null;
                    updateButtonStates(); // Instantly disable buttons upon drop-out while retaining manual override
                    
                    statusEl.innerText = "Face Lost (Waiting...)";
                    statusEl.className = "warning";
                }

                // Smart Inactivity & Fresh Reset Timer (4 Seconds without face)
                if (!faceLostTimer && (currentStaffId || manualOverride)) {
                    faceLostTimer = setTimeout(() => {
                        resetTerminalState();
                        statusEl.innerText = "Scanning for Face...";
                        statusEl.className = "";
                    }, 4000);
                } else if (!faceLostTimer && !currentStaffId) {
                    // Ensures standard state messaging if completely idle
                    statusEl.innerText = "Scanning for Face...";
                    statusEl.className = "";
                }
            }
        }, 200);
    });

    function resetTerminalState() {
        manualOverride = false;
        currentStaffId = null;
        currentStaffName = "";
        allowedAction = null;
        
        const trigger = document.getElementById('staff-dropdown-trigger');
        document.getElementById('staff-trigger-text').innerText = "Face scanner active (Select if 1st time)...";
        trigger.classList.remove('selected');
        trigger.classList.remove('disabled'); // Re-enable for the next potential new person
        
        updateButtonStates();
        faceLostTimer = null;
    }

    function stopScanner() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (detectionInterval) clearInterval(detectionInterval);
        if (faceLostTimer) { clearTimeout(faceLostTimer); faceLostTimer = null; }
        cameraActive = false;
        isFaceDetected = false;
        canvasEl.getContext('2d').clearRect(0, 0, canvasEl.width, canvasEl.height);
    }

    function updateButtonStates() {
        btnIn.disabled = true;
        btnOut.disabled = true;
        
        if (isFaceDetected && currentStaffId) {
            if (allowedAction === 'in') btnIn.disabled = false;
            if (allowedAction === 'out') btnOut.disabled = false;
        }
    }

    // --- 4. Authentication & Branch Session ---
    async function checkUser() {
        const { data: { session } } = await supabase.auth.getSession();
        handleAuthChange(session?.user);
    }
    
    supabase.auth.onAuthStateChange((event, session) => { 
        handleAuthChange(session?.user); 
    });

    async function handleAuthChange(user) {
        document.getElementById('global-loader').style.display = 'none';
        
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            
            const email = user.email.toLowerCase();
            const { data: branchData } = await supabase.from('branches_directory').select('id, branch_name').eq('email', email).single();
            
            if (branchData) { 
                currentBranchId = branchData.id; 
                currentBranchName = branchData.branch_name; 
            }
            // Safe fallbacks if branch isn't connected to email yet
            else if (email.includes('murlipura1')) currentBranchName = "Murlipura, 1 Number";
            else if (email.includes('vki17')) currentBranchName = "VKI, 17 Number";
            else if (email.includes('lohamandi')) currentBranchName = "VKI, Lohamandi";
            else if (email.includes('shastri')) currentBranchName = "Shastri Nagar";
            else if (email.includes('murlipura6')) currentBranchName = "Murlipura, 6 Number";
            else currentBranchName = "Central / Unassigned Branch";

            document.getElementById('detected-branch-display').innerHTML = currentBranchName;
            displayToast("Branch Session Active.", "success");
            
            // FETCH STAFF & FILTER
            const { data: sData } = await supabase.from('staff_directory').select('id, name, face_descriptor').order('name');
            
            if (sData) {
                // Populate global staff map for instant resolution from UUIDs
                staffMap = {};
                sData.forEach(s => {
                    staffMap[s.id] = { id: s.id, name: s.name };
                });

                // Filter out anyone who already has a face_descriptor assigned for the dropdown list
                unregisteredStaffList = sData.filter(s => !s.face_descriptor || s.face_descriptor.length === 0).map(s => ({ id: s.id, name: s.name }));
                
                document.getElementById('staff-dropdown-trigger').classList.remove('disabled');
                document.getElementById('staff-trigger-text').innerText = "Face scanner active (Select if 1st time)...";
                renderStaffDropdown(unregisteredStaffList);
            }
            
            if (!cameraActive) initScanner();
            
        } else {
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            currentBranchId = null;
            currentBranchName = "";
            btnIn.disabled = true;
            btnOut.disabled = true;
            stopScanner();
        }
    }
    
    checkUser();

    // Switch Camera Logic
    document.getElementById('switch-camera-btn').addEventListener('click', async () => {
        if (isSwitchingCamera) return; 
        isSwitchingCamera = true;
        const btn = document.getElementById('switch-camera-btn');
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Switching...';
        btn.style.opacity = '0.6';

        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
        
        try {
            await startCamera(currentFacingMode); 
        } catch (err) {
            console.error("Camera Switch Error:", err);
        } finally {
            isSwitchingCamera = false;
            btn.innerHTML = originalText;
            btn.style.opacity = '1';
        }
    });

    // Dropdown Handlers
    const dropdownTrigger = document.getElementById('staff-dropdown-trigger');
    const dropdownMenu = document.getElementById('staff-dropdown-menu');
    const searchInput = document.getElementById('staff-search');
    const triggerText = document.getElementById('staff-trigger-text');

    function renderStaffDropdown(list) {
        const optionsContainer = document.getElementById('staff-options');
        
        if (list.length === 0) {
            optionsContainer.innerHTML = `<div class="custom-option disabled-option">All staff are registered!</div>`;
            return;
        }
        
        optionsContainer.innerHTML = list.map(s => `<div class="custom-option" data-id="${s.id}">${s.name}</div>`).join('');
        
        document.querySelectorAll('.custom-option:not(.disabled-option)').forEach(opt => {
            opt.addEventListener('click', () => {
                currentStaffId = opt.getAttribute('data-id');
                currentStaffName = opt.innerText;
                
                // Manual Override active so AI doesn't switch it back instantly
                manualOverride = true;
                
                triggerText.innerText = `${currentStaffName}`;
                
                dropdownTrigger.classList.add('selected');
                dropdownMenu.classList.remove('show');
                
                checkStaffStatus(currentStaffId, currentStaffName);
            });
        });
    }

    dropdownTrigger.addEventListener('click', () => {
        if (dropdownTrigger.classList.contains('disabled')) {
            displayToast("Dropdown locked. Auto-identified face in frame.", "error");
            return;
        }
        dropdownMenu.classList.toggle('show');
        if (dropdownMenu.classList.contains('show')) {
            searchInput.value = "";
            renderStaffDropdown(unregisteredStaffList);
            searchInput.focus(); 
        }
    });

    searchInput.addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const filteredList = unregisteredStaffList.filter(s => s.name.toLowerCase().includes(searchTerm));
        renderStaffDropdown(filteredList);
    });

    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('staff-dropdown');
        if (dropdown && !dropdown.contains(e.target)) {
            dropdownMenu.classList.remove('show');
        }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
        const e = document.getElementById('email-input').value;
        const p = document.getElementById('password-input').value;
        const msg = document.getElementById('error-msg');
        
        msg.style.display = 'none'; 
        const { error } = await supabase.auth.signInWithPassword({ email: e, password: p });
        
        if(error) { 
            msg.style.display = 'block'; 
            msg.innerText = error.message; 
        }
    });
    
    document.getElementById('logout-btn').addEventListener('click', async () => { 
        await supabase.auth.signOut(); 
    });
    
    document.getElementById('password-input').addEventListener('keypress', (e) => { 
        if(e.key === 'Enter') document.getElementById('login-btn').click(); 
    });
    
    document.getElementById('toggle-password-btn').addEventListener('click', () => {
        const passInput = document.getElementById('password-input');
        if (passInput.type === 'password') { 
            passInput.type = 'text'; 
            document.getElementById('toggle-password-btn').style.color = 'var(--primary)'; 
        } else { 
            passInput.type = 'password'; 
            document.getElementById('toggle-password-btn').style.color = 'var(--text-soft)'; 
        }
    });

    function triggerFlash() {
        flashOverlay.classList.add('flash');
        setTimeout(() => { flashOverlay.classList.remove('flash'); }, 150);
    }

    // --- 5. Verify Staff Attendance Status ---
    async function checkStaffStatus(sId, sName) {
        if (!sId) return;

        btnIn.disabled = true;
        btnOut.disabled = true;
        displayToast(`Checking status for ${sName.split(' ')[0]}...`, "primary");

        try {
            const todayStart = new Date();
            todayStart.setHours(0,0,0,0);

            // Check database specifically via staff_id
            const { data, error } = await supabase
                .from('attendance_logs')
                .select('action')
                .eq('staff_id', sId)
                .gte('timestamp', todayStart.toISOString())
                .order('timestamp', { ascending: false });

            if (error) throw error;

            let hasClockedIn = false;
            let hasClockedOut = false;

            if (data && data.length > 0) {
                hasClockedIn = data.some(log => log.action === 'Clock In');
                hasClockedOut = data.some(log => log.action === 'Clock Out');
            }

            if (hasClockedIn && hasClockedOut) {
                allowedAction = null;
                displayToast(`Shift Complete! Already clocked in and out today.`, "success");
            } else if (hasClockedIn && !hasClockedOut) {
                allowedAction = 'out';
                displayToast(`Welcome back ${sName.split(' ')[0]}! Ready to Clock Out?`, "success");
            } else {
                allowedAction = 'in';
                displayToast(`Verified: ${sName.split(' ')[0]}. Ready to Clock In.`, "primary");
            }
            updateButtonStates();
        } catch (err) {
            console.error("Error fetching status:", err);
            displayToast("Failed to verify status. Check internet.", "error");
        }
    }

    // --- 6. Log Attendance (Instant Capture & Base64 Insertion) ---
    async function logAttendance(targetAction) {
        if (!currentStaffId) {
            displayToast("Please select or show your face to identify!", "error");
            return;
        }
        
        if (isProcessing) return;
        isProcessing = true;
        btnIn.disabled = true;
        btnOut.disabled = true;
        
        const dynamicVideo = document.getElementById('native-video');
        if(!dynamicVideo) {
            displayToast("Camera feed not active.", "error");
            isProcessing = false;
            return;
        }

        // INSTANT CAPTURE
        triggerFlash();
        displayToast(`Logging attendance securely...`, "primary"); 
        
        const hiddenCanvas = document.createElement('canvas');
        hiddenCanvas.width = 480; 
        hiddenCanvas.height = 640; 
        const ctx = hiddenCanvas.getContext('2d');
        
        // Mirror Correction
        if (currentFacingMode === "user") {
            ctx.translate(hiddenCanvas.width, 0);
            ctx.scale(-1, 1);
        }
        
        // Draw video frame to canvas
        ctx.drawImage(dynamicVideo, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
        
        // Compress to 0.6 Quality Base64 JPEG directly
        const base64Data = hiddenCanvas.toDataURL('image/jpeg', 0.6);
        
        try {
            // Direct Database Insert - Relational + Fallbacks
            const { error: dbError } = await supabase.from('attendance_logs').insert([{
                staff_id: currentStaffId,
                employee_name: currentStaffName, // Fallback historical text
                branch_id: currentBranchId,
                branch: currentBranchName, // Fallback historical text
                action: targetAction,
                timestamp: new Date().toISOString(),
                photo_capture: base64Data
            }]);
            
            if (dbError) throw dbError;

            // Auto-Enroll / Update Face Descriptor if live face vector is active and it's a first-time manual override
            if (currentLiveDescriptor && manualOverride) {
                const descriptorArray = Array.from(currentLiveDescriptor);
                await supabase.from('staff_directory')
                    .update({ face_descriptor: descriptorArray })
                    .eq('id', currentStaffId);
                    
                await loadKnownFaces(); 
                
                // Immediately slice out the newly registered person from dropdown
                unregisteredStaffList = unregisteredStaffList.filter(s => s.id !== currentStaffId);
                renderStaffDropdown(unregisteredStaffList);
            }
            
            displayToast(`🎉 Success: ${targetAction} verified!`, "success");
            
            // Trigger 4-Second Cooldown
            initiateCooldown();
            
        } catch (err) {
            console.error("Log Error:", err);
            displayToast("Database transmission failed. Try again.", "error");
            isProcessing = false;
        }
    }

    function initiateCooldown() {
        cameraActive = false; // Pause background detection cycle
        
        resetTerminalState();
        btnIn.disabled = true;
        btnOut.disabled = true;
        
        let cooldownLeft = 4;
        statusEl.innerText = `Scan Complete. Cooldown (${cooldownLeft}s)...`;
        statusEl.className = "warning";
        
        const cooldownInterval = setInterval(() => {
            cooldownLeft--;
            if (cooldownLeft > 0) {
                statusEl.innerText = `Scan Complete. Cooldown (${cooldownLeft}s)...`;
            } else {
                clearInterval(cooldownInterval);
                cameraActive = true; // Resume background detection cycle
                isProcessing = false;
                statusEl.innerText = "Scanning for Face...";
                statusEl.className = "";
            }
        }, 1000);
    }

    document.getElementById('btn-clock-in').addEventListener('click', () => logAttendance('Clock In'));
    document.getElementById('btn-clock-out').addEventListener('click', () => logAttendance('Clock Out'));

    document.getElementById('theme-toggle').addEventListener('click', () => { 
        const isLight = document.documentElement.classList.toggle('light-theme'); 
        localStorage.setItem('rj_theme', isLight ? 'light' : 'dark'); 
    });
  </script>
</body>
